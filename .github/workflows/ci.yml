# CI/CD: every PR and every push to master is verified first.
# Deploys only run after `verify` passes, then get smoke-tested live.
# Vercel's own git auto-deploy is off (vercel.json), so this is the only way to ship.
name: CI/CD

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: 24
  VERCEL_CLI: vercel@64.5.0
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  verify:
    name: verify # required status check in branch protection — keep this name stable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # gitleaks scans the commits in this push/PR

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - name: Type-check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Verify build (manifest, icons, service worker, no secrets, size budget)
        run: npm run verify
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Scan commits for leaked secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy-preview:
    name: Deploy preview
    needs: verify
    # forks don't get secrets, so only preview PRs from this repo
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    environment:
      name: preview
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Check Vercel is configured
        id: gate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel secrets not set — skipping deploy. Add VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID to enable."
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.ok == 'true'
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.ok == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install -g ${{ env.VERCEL_CLI }}
        if: steps.gate.outputs.ok == 'true'
      - run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        if: steps.gate.outputs.ok == 'true'
      - run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        if: steps.gate.outputs.ok == 'true'
      - id: deploy
        if: steps.gate.outputs.ok == 'true'
        run: echo "url=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"
      - name: Smoke test preview
        if: steps.gate.outputs.ok == 'true'
        run: npm run smoke -- "${{ steps.deploy.outputs.url }}"
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - run: echo "Preview → ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
        if: steps.gate.outputs.ok == 'true'

  deploy-production:
    name: Deploy production
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - name: Check Vercel is configured
        id: gate
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Vercel secrets not set — skipping deploy. Add VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID to enable."
          fi
      - uses: actions/checkout@v7
        if: steps.gate.outputs.ok == 'true'
      - uses: actions/setup-node@v7
        if: steps.gate.outputs.ok == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install -g ${{ env.VERCEL_CLI }}
        if: steps.gate.outputs.ok == 'true'
      - run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}
        if: steps.gate.outputs.ok == 'true'
      - run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        if: steps.gate.outputs.ok == 'true'
      - id: deploy
        if: steps.gate.outputs.ok == 'true'
        run: echo "url=$(vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})" >> "$GITHUB_OUTPUT"
      - name: Smoke test production
        if: steps.gate.outputs.ok == 'true'
        run: npm run smoke -- "${{ steps.deploy.outputs.url }}"
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
      - run: echo "Production → ${{ steps.deploy.outputs.url }}" >> "$GITHUB_STEP_SUMMARY"
        if: steps.gate.outputs.ok == 'true'
